spring:
  datasource:
    # dev 环境：本机没有 PG，远程连接服务器；同机部署时可设 DB_HOST=127.0.0.1 覆盖
    # 第一个数据源：AI Agent 主库（未来 pgvector / checkpointer 使用）
    primary:
      url: jdbc:postgresql://${DB_HOST:8.141.88.84}:15432/ai_demo
      username: postgres
      password: ${DB_PASSWORD}
    # 第二个数据源：登录鉴权专用库（t_user / t_anonymous_quota）
    auth:
      url: jdbc:postgresql://${DB_HOST:8.141.88.84}:15432/ai_auth
      username: postgres
      password: ${DB_PASSWORD}
  # Redis：token 服务端存储（可吊销、重启不丢），dev 远程连接
  data:
    redis:
      host: ${REDIS_HOST:8.141.88.84}
      port: ${REDIS_PORT:911}
      password: ${REDIS_PASSWORD:${DB_PASSWORD}}
      timeout: 3s
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen3.8-27b
      embedding:
        options:
          model: qwen3.7-text-embedding-flash
          # sk-vvipvgourebzpveaaqrqilgkpxtitlnlhobbuvjxazyydevq
    vectorstore:
      pgvector:
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: 1024
        initialize-schema: true

rag:
  retrievers:
    top-k: 20
    similarity-threshold: 0.2
  rerank:
    enable: true
    top-n: 5
    model: qwen3.7-text-rerank

file:
  path: docs/note